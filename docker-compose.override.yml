# ========================================================
# ENTERPRISE PYTHON CLOUD STUDIO - LOCAL DEVELOPMENT OVERRIDE
# CUSTOM PORTS ONLY: API=8765, Frontend Dev=3765, Postgres=5476, Redis=6395
# NO NGINX IN LOCAL DEV: Application runs directly on http://localhost:8765
# ========================================================

services:
  # ------------------------------------------------------
  # API: Development Mode (Runs directly on host port 8765)
  # ------------------------------------------------------
  api:
    environment:
      - APP_DEBUG=true
      - APP_ENV=development

  # ------------------------------------------------------
  # Database (5476) & Redis (6395): Internal Docker Network Only
  # ------------------------------------------------------
  postgres:
    ports: []

  redis:
    ports: []
