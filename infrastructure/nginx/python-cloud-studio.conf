# ==============================================================================
# Enterprise Python Cloud Studio — Production Host Nginx Configuration
# Target File on Production Server: /etc/nginx/sites-available/python-cloud-studio
# Target Symlink: /etc/nginx/sites-enabled/python-cloud-studio
#
# Server: root@vmi3043660
#
# CRITICAL SAFETY & NON-INTERFERENCE RULES:
# 1. This file is 100% ISOLATED. It NEVER modifies, overwrites, or touches
#    existing site configurations (such as /etc/nginx/sites-available/lms).
# 2. Reuses host Nginx installation; Python Cloud Studio runs backend in Docker
#    bound strictly to 127.0.0.1:8765.
# 3. HTTP ONLY (Port 80). No SSL/TLS certificates or Certbot configured.
# 4. Never reload or restart Nginx without testing `sudo nginx -t` first and
#    obtaining explicit approval.
# ==============================================================================

# WebSocket Upgrade Connection Mapping
# (Note: If this map is already defined in /etc/nginx/nginx.conf or another site,
# comment this block out to prevent duplicate map errors during nginx -t)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your dedicated domain name for Python Cloud Studio
    # Ensure this domain has an A record pointing to this server IP
    server_name studio.example.com;

    # Client body limit for large dataset, CSV, Parquet, and notebook uploads
    client_max_body_size 100M;

    # Dedicated access and error logs (prevents polluting LMS or other site logs)
    access_log /var/log/nginx/python_cloud_studio_access.log;
    error_log  /var/log/nginx/python_cloud_studio_error.log warn;

    # Production Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Reverse Proxy -> Python Cloud Studio Docker Container (127.0.0.1:8765)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # Bidirectional WebSocket support for interactive cell execution
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so real-time Python output and prints stream immediately
        proxy_buffering off;
        proxy_cache off;

        # Extended timeouts for long-running notebook cells and persistent WebSockets
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}

